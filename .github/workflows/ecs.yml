name: Redeploy Dagster ECS Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      service:
        description: "Dagster ECS service"
        required: true
        type: choice
        options:
          - webserver
          - daemon
        default: webserver

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve environment config
        id: envcfg
        shell: bash
        run: |
          if [[ "${{ inputs.environment }}" == "dev" ]]; then
            echo "account_id=449431850278" >> "$GITHUB_OUTPUT"
            echo "aws_profile=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.environment }}" == "prod" ]]; then
            echo "account_id=593025701104" >> "$GITHUB_OUTPUT"
            echo "aws_profile=prod" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported environment: ${{ inputs.environment }}" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.envcfg.outputs.account_id }}:role/GitHubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Create named AWS profile for CLI parity
        shell: bash
        run: |
          profile="${{ steps.envcfg.outputs.aws_profile }}"
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile "$profile"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile "$profile"
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile "$profile"
          aws configure set region "${{ env.AWS_REGION }}" --profile "$profile"

      - name: Lookup cluster and service
        id: lookup
        shell: bash
        run: |
          set -euo pipefail

          profile="${{ steps.envcfg.outputs.aws_profile }}"

          cluster_arn=$(aws ecs list-clusters \
            --region "${{ env.AWS_REGION }}" \
            --profile "$profile" \
            --query "clusterArns[?contains(@, 'DagsterEcsStack')]|[0]" \
            --output text)

          if [[ -z "$cluster_arn" || "$cluster_arn" == "None" ]]; then
            echo "Could not find ECS cluster containing 'DagsterEcsStack'." >&2
            exit 1
          fi

          if [[ "${{ inputs.service }}" == "webserver" ]]; then
            service_match="DagsterWebserver"
          else
            service_match="DagsterDaemonService"
          fi

          service_arn=$(aws ecs list-services \
            --cluster "$cluster_arn" \
            --region "${{ env.AWS_REGION }}" \
            --profile "$profile" \
            --query "serviceArns[?contains(@, '$service_match')]|[0]" \
            --output text)

          if [[ -z "$service_arn" || "$service_arn" == "None" ]]; then
            echo "Could not find ECS service containing '$service_match' in cluster '$cluster_arn'." >&2
            exit 1
          fi

          cluster_name="${cluster_arn##*/}"
          service_name="${service_arn##*/}"

          echo "cluster_name=$cluster_name" >> "$GITHUB_OUTPUT"
          echo "service_name=$service_name" >> "$GITHUB_OUTPUT"

      # - name: Force new deployment
      #   shell: bash
      #   run: |
      #     aws ecs update-service \
      #       --cluster "${{ steps.lookup.outputs.cluster_name }}" \
      #       --service "${{ steps.lookup.outputs.service_name }}" \
      #       --force-new-deployment \
      #       --profile "${{ steps.envcfg.outputs.aws_profile }}" \
      #       --region "${{ env.AWS_REGION }}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## ECS redeploy triggered"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Profile: ${{ steps.envcfg.outputs.aws_profile }}"
            echo "- Cluster: ${{ steps.lookup.outputs.cluster_name }}"
            echo "- Service: ${{ steps.lookup.outputs.service_name }}"
            echo "- Region: ${{ env.AWS_REGION }}"
          } >> "$GITHUB_STEP_SUMMARY"
